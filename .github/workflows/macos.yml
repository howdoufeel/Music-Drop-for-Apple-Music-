name: macOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The integration tests encode and probe real audio.
      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Cache pinned helpers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/MusicDropDependencies
          key: helpers-${{ hashFiles('Resources/Helpers/dependencies.json') }}

      - name: Integration tests
        run: bash test.sh

      - name: Build installer
        run: bash build.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Music-Drop-dmg
          path: build/Music Drop.dmg
          if-no-files-found: error
          retention-days: 14
